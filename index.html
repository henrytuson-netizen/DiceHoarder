<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dice Hoarder</title>
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div>Held Die: <span id="hud-die" class="held">-</span></div>
    <div>Material: <b id="hud-material">-</b></div>
    <div>Color: <b id="hud-color">-</b></div>
    <hr />
    <div>Set Dice: <span id="hud-set"></span></div>
    <div>Set Current Value: <b id="hud-value">0 Gold</b></div>
  </div>
  <div id="crosshair"></div>
  <div id="hint">Click to look · WASD walk · Shift run · arrows look · R reset</div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
